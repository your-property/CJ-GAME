<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C.J. — Open World Ultra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Barlow+Condensed:wght@300;400;600;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- TITLE SCREEN -->
<div id="titleScreen">
  <div class="sky-gradient"></div>
  <div class="sun-orb"></div>
  <div class="sun-rays"></div>
  <div class="horizon-glow"></div>
  <div class="road-surface">
    <div class="road-line"></div>
    <div class="road-line"></div>
    <div class="road-line"></div>
  </div>
  <div class="title-content">
    <div class="title-logo">C.J.</div>
    <div class="title-sub">OPEN WORLD ULTRA</div>
    <div class="title-tag">DAYTIME CHRONICLES · NEXT GEN</div>
    <div class="title-features">
      <span>☀ DYNAMIC DAYLIGHT</span>
      <span>🚗 REALISTIC PHYSICS</span>
      <span>🌆 OPEN WORLD</span>
    </div>
    <div class="start-btn" id="startBtn">▶ PRESS ENTER OR CLICK TO DRIVE</div>
  </div>
</div>

<!-- PAUSE OVERLAY -->
<div id="pauseOverlay"><span>II PAUSED</span></div>

<!-- CANVASES -->
<canvas id="gameCanvas"></canvas>
<canvas id="hudCanvas"></canvas>

<!-- CONTROL BAR -->
<div id="ctrlBar">
  W/↑ ACCELERATE &nbsp;·&nbsp; S/↓ BRAKE/REVERSE &nbsp;·&nbsp; A/D STEER &nbsp;·&nbsp; SPACE HANDBRAKE &nbsp;·&nbsp; SHIFT NITRO &nbsp;·&nbsp; C CAMERA &nbsp;·&nbsp; L LOOK BACK &nbsp;·&nbsp; P PAUSE
</div>

<!-- THREE.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
